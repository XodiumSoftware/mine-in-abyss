[package]
name = "mine-in-abyss"
version = "0.0.1"
edition = "2024"
authors = ["Xodium"]
description = "The recreation of 'Made In Abyss' into Minecraft."

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = "0.2.1"
tracing = "0.1.44"
strum = { version = "0.28.0", features = ["derive"] }

[profile.release]
lto = true
strip = true

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
variant_size_differences = "warn"
unstable_features = "warn"
unused_extern_crates = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"

[lints.clippy]
all = "warn"
