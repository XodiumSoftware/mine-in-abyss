[package]
name = "mine-in-abyss"
version = "0.0.1"
edition = "2024"
authors = ["Xodium"]
description = "The recreation of 'Made In Abyss' into Minecraft."

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = "0.2.1+26.3-26.51"
tracing = "0.1.44"
serde = { version = "1.0.229", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }

[profile.release]
lto = true
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
