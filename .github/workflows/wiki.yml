name: Wiki CI/CD

on:
  push:
    branches: [main]
    paths:
      - "wiki/src/**"
      - "wiki/theme/**"
      - "wiki/book.toml"
      - "wiki/.markdownlint.json"
      - "wiki/lychee.toml"
      - ".github/workflows/wiki.yml"
  pull_request:
    branches: [main]
    paths:
      - "wiki/src/**"
      - "wiki/theme/**"
      - "wiki/book.toml"
      - "wiki/.markdownlint.json"
      - "wiki/lychee.toml"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # renovate: datasource=crate depName=mdbook
  MDBOOK_VERSION: "0.5.2"
  # renovate: datasource=crate depName=mdbook-variables
  MDBOOK_VARIABLES_VERSION: "0.4.1"

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    working-directory: wiki

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1

      - id: setup_node
        name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - id: install_markdownlint
        name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2
        shell: bash

      - id: run_markdownlint
        name: Run Markdown Lint
        run: markdownlint-cli2 --config .markdownlint.json "src/**/*.md"
        shell: bash

      - id: lint_summary
        name: Upload Lint Summary
        if: failure()
        run: |
          markdownlint-cli2 --config .markdownlint.json "src/**/*.md" --format json > lint-results.json || true
          echo "## ❌ Markdown Lint Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat lint-results.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        shell: bash

      - id: linkcheck
        name: Link Check
        uses: lycheeverse/lychee-action@v2
        with:
          # Remap lives in lychee.toml at the wiki root.
          args: --verbose --no-progress 'src/**/*.md'
          fail: true
          workingDirectory: wiki

  build:
    name: Build mdBook
    runs-on: ubuntu-latest
    needs: [lint]
    environment:
      name: "${{ github.ref_name }}"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - id: install_cargo_binstall
        name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.25.3

      - id: cache_mdbook
        name: Cache mdBook
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-variables
          key: ${{ runner.os }}-mdbook-${{ env.MDBOOK_VERSION }}-vars-${{ env.MDBOOK_VARIABLES_VERSION }}

      - id: install_mdbook
        name: Install mdBook
        run: cargo binstall mdbook@${{ env.MDBOOK_VERSION }} --no-confirm --force
        shell: bash

      - id: install_mdbook_variables
        name: Install mdbook-variables
        run: cargo binstall mdbook-variables@${{ env.MDBOOK_VARIABLES_VERSION }} --no-confirm --force
        shell: bash

      - id: build_book
        name: Build mdBook
        run: mdbook build
        shell: bash

      - id: upload_artifact
        name: Upload book artifact
        uses: actions/upload-artifact@v7
        with:
          name: book
          path: wiki/book/
